<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RAIDEN II - Browser Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      -webkit-user-select: none;
      user-select: none;
    }
    #game-wrapper {
      position: relative;
      width: min(480px, 100vw);
      height: min(720px, 100dvh);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #333;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 480px) {
      canvas { border: none; }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="raiden-canvas"></canvas>
  </div>

  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/player.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/game.js"></script>
  <script>
    const { canvas, ctx } = setupCanvas("raiden-canvas");
    R.init(ctx);

    startGameLoop((_dt) => {
      const dt = Math.min(_dt, 0.1);

      handleMenus();

      if (gameState === "title") {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        R.drawStarfield();
        R.drawTitle(highScore);
      } else if (gameState === "playing") {
        updateGame(dt);
        renderGame();
      } else if (gameState === "pause") {
        renderGame();
        R.drawPause();
      } else if (gameState === "gameover") {
        renderGame();
        R.drawGameOver(player ? player.score : 0, highScore);
      }

      input.clearJustPressed();
    });
  </script>
</body>
</html>
