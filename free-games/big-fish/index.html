<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>大鱼吃小鱼</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06234b;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#fff}#app{position:relative;width:100%;height:100%;padding:clamp(7px,1.5vw,18px)}canvas{display:block;width:100%;height:100%;border-radius:8px;touch-action:none;box-shadow:0 8px 30px #00142d}.hud{position:absolute;inset:clamp(16px,3vw,35px);bottom:auto;z-index:2;display:flex;justify-content:space-between;pointer-events:none}.stats,.buttons{display:flex;gap:8px}.box,button{border:1px solid #c9f6ff8a;border-radius:7px;background:#063460c9;color:#f5fdff;box-shadow:0 3px 12px #001b3770}.box{min-width:102px;padding:7px 12px;font-weight:800;font-size:15px}.box small{display:block;margin-top:2px;color:#b9eaff;font-size:11px;font-weight:500}button{min-height:38px;padding:6px 12px;font:700 14px inherit;cursor:pointer;pointer-events:auto}button:hover{background:#0a548a}#mask{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:20px;background:#001b3d55}#mask[hidden]{display:none}.panel{width:min(380px,calc(100vw - 40px));padding:29px 25px 23px;border:2px solid #b9f3ff99;border-radius:8px;background:#073b69ee;box-shadow:0 18px 45px #00112ed0;text-align:center}.panel h1{margin:0;color:#fff5ad;font-size:36px;text-shadow:0 3px #0a3159}.panel p{margin:12px 0;color:#d4f6ff;line-height:1.65}.panel .hint{font-size:13px;color:#a9def3}.primary{margin-top:6px;padding:10px 26px;border:2px solid #fff4ae;background:#ffdf61;color:#1b4d54;box-shadow:0 3px #b07b18;font-size:17px}.primary:hover{background:#ffec8f}@media(max-width:520px){#app{padding:5px}.hud{inset:14px}.stats{gap:5px}.box{min-width:82px;padding:6px 8px;font-size:13px}.buttons{gap:5px}button{padding:5px 8px;font-size:13px}.panel h1{font-size:30px}}
</style>
</head>
<body><main id="app"><canvas id="c" aria-label="大鱼吃小鱼游戏"></canvas><div class="hud"><div class="stats"><div class="box" id="score">分数：0<small>经验 0 / 100</small></div><div class="box" id="level">体型：1 级<small>半径 18 像素</small></div></div><div class="buttons"><button id="pause">暂停</button><button id="restart">重开</button></div></div><div id="mask"><section class="panel" id="panel"></section></div></main>
<script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),score=document.querySelector('#score'),level=document.querySelector('#level'),mask=document.querySelector('#mask'),panel=document.querySelector('#panel'),pause=document.querySelector('#pause'),restart=document.querySelector('#restart');let W,H,d=1,last=0,S,P,F,B,We,R,Sh,Pt,Tx;const keys={},mouse={on:false,x:0,y:0},cols=['#ffd75a','#ff9a52','#66c7ef','#f78cb4','#62cf92','#a98ae8'];const rn=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);if(P){P.x=cl(P.x,P.r,W-P.r);P.y=cl(P.y,P.r+25,H-P.r-12)}scene()}
function scene(){We=Array.from({length:Math.max(7,W/95|0)},(_,i)=>({x:(i+.4)*W/Math.max(7,W/95|0)+rn(-17,17),h:rn(50,115),w:rn(7,12),p:rn(0,7),co:Math.random()<.5?'#167d74':'#1b9b75'}));R=Array.from({length:Math.max(5,W/155|0)},()=>({x:rn(0,W),y:H-rn(4,17),r:rn(17,41),co:Math.random()<.5?'#1d5370':'#245b75'}));Sh=Array.from({length:8},()=>({x:rn(0,W),y:rn(H*.2,H*.62),r:rn(5,13),v:rn(6,17),dir:Math.random()<.5?1:-1}))}
function bubbles(){return Array.from({length:Math.max(24,W/26|0)},()=>({x:rn(0,W),y:rn(0,H),r:rn(1.5,5),v:rn(12,30),a:rn(.25,.7)}))}
function need(){return S.lv>=10?0:100+(S.lv-1)*55}function hud(){score.innerHTML='分数：'+S.sc+'<small>经验 '+S.xp+' / '+need()+'</small>';level.innerHTML='体型：'+S.lv+' 级<small>'+(S.lv===10?'已经是海中霸主':'半径 '+Math.round(P.r)+' 像素')+'</small>'}
function reset(){S={mode:'start',sc:0,lv:1,xp:0,t:0,spawn:0,flash:0,shake:0};P={x:W*.38,y:H*.52,vx:0,vy:0,r:18,a:0,tail:0};F=[];Pt=[];Tx=[];B=bubbles();hud();startPanel()}
function startPanel(){mask.hidden=false;panel.innerHTML='<h1>大鱼吃小鱼</h1><p>吃掉小鱼，避开大鱼</p><button class="primary" type="button" data-action="start">开始游戏</button><p class="hint">电脑使用鼠标或方向键；手机手指拖动控制</p>'}
function start(){S.mode='play';mask.hidden=true;pause.textContent='暂停';last=performance.now()}function pausePanel(){mask.hidden=false;panel.innerHTML='<h1>游戏已暂停</h1><p>海里的时间暂时停住了。</p><button class="primary" type="button" data-action="resume">继续游戏</button>'}
function endPanel(){mask.hidden=false;panel.innerHTML='<h1>游戏结束</h1><p>最终分数：<b>'+S.sc+'</b><br>最终体型：<b>'+S.lv+' 级</b></p><button class="primary" type="button" data-action="restart">再玩一次</button>'}
function toggle(){if(S.mode==='play'){S.mode='pause';pause.textContent='继续';pausePanel()}else if(S.mode==='pause'){S.mode='play';pause.textContent='暂停';mask.hidden=true;last=performance.now()}}
function spawn(){let diff=cl((S.t-8)/75+S.sc/2400,0,1),r,roll=Math.random();if(S.t<10)r=rn(8,Math.min(22,P.r*.8));else if(roll<.47-diff*.16)r=rn(8,Math.max(12,P.r*.83));else if(roll<.84-diff*.12)r=rn(25,50);else r=rn(51,76+diff*24);if(Math.random()<.18)r=cl(P.r*rn(.62,1.38+diff*.25),8,100);let dir=Math.random()<.5?1:-1,y,n=0;do{y=rn(r+32,H-r-22);n++}while(r>P.r*1.15&&Math.hypot((dir>0?-r:W+r)-P.x,y-P.y)<200&&n<20);F.push({x:dir>0?-r*2:W+r*2,y,r,dir,v:rn(25,57)*(1+diff*.45),co:cols[Math.random()*cols.length|0],p:rn(0,7),b:0})}
function move(dt){let ax=0,ay=0,k=false;if(keys.ArrowLeft||keys.a||keys.A){ax--;k=true}if(keys.ArrowRight||keys.d||keys.D){ax++;k=true}if(keys.ArrowUp||keys.w||keys.W){ay--;k=true}if(keys.ArrowDown||keys.s||keys.S){ay++;k=true}if(k){let n=Math.hypot(ax,ay)||1;P.vx+=ax/n*760*dt;P.vy+=ay/n*760*dt}else if(mouse.on){P.vx+=(mouse.x-P.x)*5.3*dt;P.vy+=(mouse.y-P.y)*5.3*dt}let v=Math.hypot(P.vx,P.vy),max=250+S.lv*8;if(v>max){P.vx*=max/v;P.vy*=max/v}P.vx*=Math.pow(.0009,dt);P.vy*=Math.pow(.0009,dt);P.x+=P.vx*dt;P.y+=P.vy*dt;if(P.x<P.r){P.x=P.r;P.vx*=-.25}if(P.x>W-P.r){P.x=W-P.r;P.vx*=-.25}if(P.y<P.r+28){P.y=P.r+28;P.vy*=-.25}if(P.y>H-P.r-14){P.y=H-P.r-14;P.vy*=-.25}if(v>6)P.a=Math.atan2(P.vy,P.vx);P.tail+=dt*(8+v*.035)}
function fishes(dt){S.spawn-=dt;let gap=Math.max(.35,1.22-S.t*.008-S.sc*.00005);if(S.spawn<=0){spawn();S.spawn=gap*rn(.65,1.2)}F.forEach(f=>{f.x+=f.dir*f.v*dt;f.p+=dt*8;f.b=Math.max(0,f.b-dt)});F=F.filter(f=>f.x>-f.r*3&&f.x<W+f.r*3)}
function hit(){for(let i=F.length-1;i>=0;i--){let f=F[i],reach=P.r*.72+f.r*.64;if(Math.hypot(P.x-f.x,P.y-f.y)>reach)continue;if(f.r<=P.r*.85){let q=f.r<25?10:f.r<P.r*.72?30:50;S.sc+=q;S.xp+=q;F.splice(i,1);Tx.push({x:f.x,y:f.y-f.r,s:'+'+q,co:'#fff2a1',life:.8,max:.8,z:16});for(let j=0;j<9;j++)Pt.push({x:f.x,y:f.y,vx:rn(-90,90),vy:rn(-90,90),r:rn(1,3.5),co:f.co,life:.45,max:.45});grow()}else if(f.r>=P.r*1.15){S.mode='end';S.shake=.45;Tx.push({x:P.x,y:P.y-35,s:'被大鱼吃掉了！',co:'#ffe293',life:1,max:1,z:20});setTimeout(endPanel,360);return}else{let dx=P.x-f.x,dy=P.y-f.y,n=Math.hypot(dx,dy)||1;P.vx+=dx/n*120;P.vy+=dy/n*120;f.b=.18}}}
function grow(){while(S.lv<10&&S.xp>=need()){S.xp-=need();S.lv++;P.r+=4.8;S.flash=.32;Tx.push({x:P.x,y:P.y-P.r-22,s:'升级！',co:'#fff58c',life:1.3,max:1.3,z:25});for(let j=0;j<22;j++)Pt.push({x:P.x,y:P.y,vx:rn(-150,150),vy:rn(-150,150),r:rn(2,5),co:'#d7f8ff',life:.8,max:.8})}hud()}
function effects(dt){Pt.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=65*dt;p.life-=dt});Pt=Pt.filter(p=>p.life>0);Tx.forEach(t=>{t.y-=28*dt;t.life-=dt});Tx=Tx.filter(t=>t.life>0);S.flash=Math.max(0,S.flash-dt);S.shake=Math.max(0,S.shake-dt)}
function fish(x0,y,r,a,co,time,shade){x.save();x.translate(x0,y);x.rotate(a);let tail=Math.sin(time*.008+x0*.03)*r*.16;x.fillStyle=co;x.beginPath();x.moveTo(-r*.7,0);x.lineTo(-r*1.25,-r*.58+tail);x.lineTo(-r*1.2,r*.58+tail);x.closePath();x.fill();x.beginPath();x.ellipse(0,0,r,r*.62,0,0,7);x.fill();if(!shade){x.fillStyle='#fff';x.beginPath();x.arc(r*.42,-r*.18,Math.max(2.5,r*.17),0,7);x.fill();x.fillStyle='#14345b';x.beginPath();x.arc(r*.47,-r*.18,Math.max(1.2,r*.07),0,7);x.fill()}x.restore()}
function draw(t){x.save();if(S.shake)x.translate(rn(-1,1)*S.shake*10,rn(-1,1)*S.shake*10);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#79d9ee');g.addColorStop(.46,'#258dc1');g.addColorStop(1,'#063c76');x.fillStyle=g;x.fillRect(0,0,W,H);let light=x.createRadialGradient(W*.48,-20,10,W*.48,-20,H*.85);light.addColorStop(0,'#dfffff60');light.addColorStop(1,'#dfffff00');x.fillStyle=light;x.fillRect(0,0,W,H);Sh.forEach(s=>{s.x+=s.dir*s.v*.016;if(s.x<-30)s.x=W+30;if(s.x>W+30)s.x=-30;fish(s.x,s.y,s.r,s.dir>0?0:Math.PI,'#0f5b8a55',t,true)});B.forEach(b=>{b.y-=b.v*.016;b.x+=Math.sin(t*.001+b.y*.03)*.08;if(b.y<-b.r){b.y=H+b.r;b.x=rn(0,W)}x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.strokeStyle='#dcffff'+Math.round(b.a*255).toString(16).padStart(2,'0');x.lineWidth=1.2;x.stroke()});R.forEach(r=>{x.beginPath();x.ellipse(r.x,r.y,r.r,r.r*.48,0,Math.PI,7);x.fillStyle=r.co;x.fill();x.strokeStyle='#75b4c055';x.stroke()});We.forEach(w=>{let s=Math.sin(t*.0014+w.p)*10;x.strokeStyle=w.co;x.lineWidth=w.w;x.lineCap='round';x.beginPath();x.moveTo(w.x,H+10);x.bezierCurveTo(w.x-s,H-w.h*.32,w.x+s*1.2,H-w.h*.68,w.x+s,H-w.h);x.stroke()});if(S.flash){x.globalAlpha=S.flash*.32;x.fillStyle='#dffeff';x.fillRect(0,0,W,H);x.globalAlpha=1}F.forEach(f=>fish(f.x,f.y,f.r*(1+f.b*.12),f.dir>0?0:Math.PI,f.co,t));fish(P.x,P.y,P.r,P.a,'#ffe064',t);Pt.forEach(p=>{x.globalAlpha=p.life/p.max;x.fillStyle=p.co;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});x.globalAlpha=1;Tx.forEach(q=>{x.globalAlpha=Math.min(1,q.life*2);x.fillStyle=q.co;x.font='700 '+q.z+'px Microsoft YaHei';x.textAlign='center';x.fillText(q.s,q.x,q.y)});x.restore()}
function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;if(S.mode==='play'){S.t+=dt;move(dt);fishes(dt);hit();effects(dt)}draw(now);requestAnimationFrame(loop)}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.addEventListener('pointermove',e=>{let p=point(e);mouse.x=p.x;mouse.y=p.y;mouse.on=true});c.addEventListener('pointerdown',e=>{let p=point(e);mouse.x=p.x;mouse.y=p.y;mouse.on=true;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')mouse.on=false});c.addEventListener('pointerup',()=>mouse.on=false);addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){keys[e.key]=true;e.preventDefault()}if(e.key===' '||e.key==='Escape'){e.preventDefault();toggle()}});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('resize',resize);panel.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(a==='start')start();if(a==='resume')toggle();if(a==='restart'){reset();start()}});pause.onclick=toggle;restart.onclick=()=>{reset();start()};resize();reset();requestAnimationFrame(loop)})();
</script></body></html>
