<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a18"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <radialGradient id="bglow" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#ff6622" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#bglow)"/>
  <g fill="#fff">
    <rect x="20" y="20" width="1" height="1"/>
    <rect x="80" y="14" width="1" height="1"/>
    <rect x="140" y="26" width="1" height="1"/>
    <rect x="220" y="18" width="1" height="1"/>
    <rect x="280" y="22" width="1" height="1"/>
    <rect x="60" y="50" width="1" height="1"/>
    <rect x="180" y="44" width="1" height="1"/>
    <rect x="260" y="60" width="1" height="1"/>
    <rect x="40" y="90" width="1" height="1"/>
    <rect x="120" y="100" width="1" height="1"/>
    <rect x="240" y="110" width="1" height="1"/>
  </g>
  <!-- Boss enemy -->
  <g transform="translate(160, 90)">
    <path d="M -50 -30 L 0 -45 L 50 -30 L 60 10 L 40 40 L -40 40 L -60 10 Z" fill="#5a4a30" stroke="#aa8833" stroke-width="2"/>
    <ellipse cx="0" cy="-10" rx="18" ry="12" fill="#333"/>
    <rect x="-70" y="-15" width="20" height="20" fill="#555" stroke="#aa4" stroke-width="2"/>
    <rect x="50" y="-15" width="20" height="20" fill="#555" stroke="#aa4" stroke-width="2"/>
    <circle cx="-60" cy="-5" r="8" fill="#f80"/>
    <circle cx="60" cy="-5" r="8" fill="#f80"/>
  </g>
  <!-- Player ship -->
  <g transform="translate(160, 165)">
    <path d="M 0 -16 L 14 -8 L 18 0 L 14 14 L -14 14 L -18 0 L -14 -8 Z" fill="#ccc" stroke="#888" stroke-width="1"/>
    <ellipse cx="0" cy="-4" rx="6" ry="7" fill="#4488cc" stroke="#fff" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#ffcc44"/>
  </g>
  <!-- Bullets -->
  <circle cx="155" cy="140" r="3" fill="#ffcc44"/>
  <circle cx="165" cy="140" r="3" fill="#ffcc44"/>
  <circle cx="150" cy="120" r="2" fill="#ffcc44"/>
  <circle cx="170" cy="120" r="2" fill="#ffcc44"/>
  <circle cx="130" cy="130" r="3" fill="#ff4444"/>
  <circle cx="190" cy="125" r="3" fill="#ff4444"/>
  <!-- Title -->
  <text x="160" y="35" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#ffcc00" text-anchor="middle">RAIDEN II</text>
</svg>