<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">数字华容道</title>
  <desc id="desc">深色背景上的数字滑块拼图封面</desc>
  <rect width="800" height="500" fill="#101827"/>
  <rect x="0" y="0" width="800" height="500" fill="#1e293b" opacity=".42"/>
  <g transform="translate(232 68)">
    <rect x="-18" y="-18" width="372" height="372" rx="28" fill="#0f172a" stroke="#64748b" stroke-width="6"/>
    <g fill="#a3e635" stroke="#ecfccb" stroke-width="4">
      <rect x="0" y="0" width="100" height="100" rx="15"/><rect x="118" y="0" width="100" height="100" rx="15"/><rect x="236" y="0" width="100" height="100" rx="15"/>
      <rect x="0" y="118" width="100" height="100" rx="15"/><rect x="118" y="118" width="100" height="100" rx="15"/><rect x="236" y="118" width="100" height="100" rx="15"/>
      <rect x="0" y="236" width="100" height="100" rx="15"/><rect x="236" y="236" width="100" height="100" rx="15"/>
    </g>
    <g fill="#1f2937" font-family="Arial, sans-serif" font-size="53" font-weight="800" text-anchor="middle">
      <text x="50" y="68">1</text><text x="168" y="68">2</text><text x="286" y="68">3</text>
      <text x="50" y="186">4</text><text x="168" y="186">5</text><text x="286" y="186">6</text>
      <text x="50" y="304">7</text><text x="286" y="304">8</text>
    </g>
    <rect x="118" y="236" width="100" height="100" rx="15" fill="#0b1220" stroke="#475569" stroke-width="4" stroke-dasharray="8 8"/>
  </g>
  <text x="400" y="456" fill="#f8fafc" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="38" font-weight="700" text-anchor="middle">数字华容道</text>
</svg>
